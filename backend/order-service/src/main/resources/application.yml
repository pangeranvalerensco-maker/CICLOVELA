spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ciclovela
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8084

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:ciclovela-default-secret-key-change-in-production-min-256-bits-long}
    expiration-ms: 86400000
  services:
    inventory-url: http://localhost:8083
