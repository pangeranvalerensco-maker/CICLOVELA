spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/batches/**
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventories/**,/api/business-entities/**,/api/waste-records/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/purchases/**,/api/sales/**
        - id: traceability-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/traceability/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173,http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
server:
  port: 8080
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
