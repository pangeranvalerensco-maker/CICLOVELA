spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ciclovela
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # P1: SMTP Email Service for Reset Password
  mail:
    host: smtp.gmail.com
    port: 587
    username: pangeranvalerensco@gmail.com
    password: "ilktiocuehxhxysf" # tanpa spasi
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:ciclovela-default-secret-key-change-in-production-min-256-bits-long}
    expiration-ms: 86400000
